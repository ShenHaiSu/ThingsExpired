app:
  name: "things-expired"
  host: "0.0.0.0"
  port: 8080
  mode: "debug"  # debug, release, test

database:
  path: "./data/app.db"  # SQLite 数据库路径
  max_idle_conns: 5
  max_open_conns: 10

jwt:
  secret: "CHANGE_ME_IN_PRODUCTION"  # ⚠️ 生产环境请修改为强密钥
  expire_hours: 24

upload:
  max_size_mb: 10
  allowed_types:
    - ".jpg"
    - ".png"
    - ".pdf"
  save_path: "./uploads"

security:
  allow_multi_login: true       # 是否允许多端登录（false: 强制单端登录）
  max_sessions_per_user: 3      # 每个用户最大会话数

log:
  level: "info"                # 日志级别: debug, info, warn, error
  path: "./logs"               # 日志文件目录
  max_size_mb: 10               # 单个日志文件最大大小(MB)
  max_backups: 30               # 保留的旧日志文件最大数量
  max_age_days: 90              # 保留的旧日志文件最大天数
  compress: true                # 是否压缩旧日志文件

frontend:
  static_path: "./dist"        # 前端静态资源目录路径（存放编译后的 HTML、CSS、JS 等文件）

expiration:
  enabled: true                # 是否启用自动过期检查
  interval_sec: 3600           # 检查间隔（秒），默认1小时
  batch_size: 100              # 每次批量处理数量，防止一次性处理过多
