app:
  name: "things-expired"
  host: "0.0.0.0"
  port: 8080
  mode: "debug"  # debug, release, test

database:
  path: "./data/app.db"  # SQLite 数据库路径
  max_idle_conns: 5
  max_open_conns: 10

jwt:
  secret: "your-secret-key-change-in-production"
  expire_hours: 24

upload:
  max_size_mb: 10
  allowed_types:
    - ".jpg"
    - ".png"
    - ".pdf"
  save_path: "./uploads"
