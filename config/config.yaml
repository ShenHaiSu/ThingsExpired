app:
  name: "things-expired"
  host: "0.0.0.0"
  port: 8080
  mode: "debug"  # debug, release, test

database:
  path: "./data/app.db"  # SQLite 数据库路径
  max_idle_conns: 5
  max_open_conns: 10

jwt:
  secret: "your-secret-key-change-in-production"
  expire_hours: 24

upload:
  max_size_mb: 10
  allowed_types:
    - ".jpg"
    - ".png"
    - ".pdf"
  save_path: "./uploads"

security:
  allow_multi_login: true       # 是否允许多端登录（false: 强制单端登录）
  max_sessions_per_user: 3      # 每个用户最大会话数

log:
  level: "info"                # 日志级别: debug, info, warn, error
  path: "./log"                 # 日志文件目录
  max_size_mb: 10               # 单个日志文件最大大小(MB)
  max_backups: 30               # 保留的旧日志文件最大数量
  max_age_days: 90              # 保留的旧日志文件最大天数
  compress: true                # 是否压缩旧日志文件
