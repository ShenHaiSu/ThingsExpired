version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: things-expired
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./config/config.yaml:/app/config/config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - things-expired-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/user/login"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  things-expired-network:
    driver: bridge
